# Builds PharmaSync and publishes target/pharmasync.jar as a GitHub Release when a version tag is pushed,
# e.g. `git tag v1.0.1 && git push origin v1.0.1`. The website's Download button points at the latest release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B package

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/pharmasync.jar
          generate_release_notes: true
          body: |
            Download **pharmasync.jar**, then run `java -jar pharmasync.jar` (Java 21 required).
            First start: sign in with `admin` / `admin123` and choose a new password.
