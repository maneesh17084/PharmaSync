# Compiles and runs the tests on every push and pull request to main.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B package

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the browser demo's business rules
        run: node --test site-tests/core.test.js
