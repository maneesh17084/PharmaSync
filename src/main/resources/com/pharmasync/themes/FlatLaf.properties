# PharmaSync look and feel: shared by the light and dark themes (loaded by Theme.setup()).

@accentColor = #0D9488

# ---- shape ----
Component.arc = 8
Button.arc = 8
TextComponent.arc = 8
CheckBox.arc = 4
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Button.innerFocusWidth = 0
Button.minimumWidth = 64
Button.margin = 5,12,5,12
TextField.margin = 4,8,4,8
PasswordField.margin = 4,8,4,8
FormattedTextField.margin = 4,8,4,8
ComboBox.padding = 3,8,3,8

# ---- scrollbars ----
ScrollBar.showButtons = false
ScrollBar.width = 11
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.trackArc = 999

# ---- tables ----
Table.rowHeight = 30
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.cellMargins = 2,8,2,8
TableHeader.height = 34
TableHeader.font = bold
TableHeader.cellMargins = 2,8,2,8

# ---- tabs, split panes, titled borders ----
TabbedPane.tabHeight = 38
TabbedPane.tabSelectionHeight = 3
TabbedPane.showTabSeparators = false
TabbedPane.tabInsets = 4,14,4,14
SplitPane.dividerSize = 9
SplitPaneDivider.style = plain
TitledBorder.font = bold
TitlePane.unifiedBackground = true

# ---- PharmaSync palette (read by com.pharmasync.ui.Theme) ----
PharmaSync.accent = @accentColor
PharmaSync.sidebar.background = #0F172A
PharmaSync.sidebar.hover = #1E293B
PharmaSync.sidebar.selected = #134E4A
PharmaSync.sidebar.text = #CBD5E1
PharmaSync.sidebar.textSelected = #FFFFFF
PharmaSync.sidebar.section = #64748B
PharmaSync.sidebar.divider = #1E293B
