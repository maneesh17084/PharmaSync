# PharmaSync light theme (on top of FlatLaf.properties in this folder).

@background = #F4F6F9

Table.background = #FFFFFF
Table.alternateRowColor = #F8FAFC
Table.gridColor = #EDF0F4
TableHeader.background = #F8FAFC
TableHeader.foreground = #475569
TableHeader.separatorColor = #E5E9EF
TableHeader.bottomSeparatorColor = #E2E8F0
ScrollPane.background = #FFFFFF
TabbedPane.selectedBackground = #FFFFFF
TabbedPane.hoverColor = #EEF2F6

PharmaSync.card.background = #FFFFFF
PharmaSync.card.border = #E3E8EF
PharmaSync.text.strong = #0F172A
PharmaSync.text.muted = #64748B
PharmaSync.topbar.background = #FFFFFF
PharmaSync.topbar.border = #E3E8EF

# Row tints (red / amber / green / grey) for alert rows in tables.
PharmaSync.tint.red = #FDECEC
PharmaSync.tint.amber = #FFF6E0
PharmaSync.tint.green = #E9F7EF
PharmaSync.tint.grey = #EEF1F4

# Status pills and tile accents: background / foreground per tone.
PharmaSync.tone.success.background = #DCFCE7
PharmaSync.tone.success.foreground = #166534
PharmaSync.tone.warning.background = #FEF3C7
PharmaSync.tone.warning.foreground = #92400E
PharmaSync.tone.danger.background = #FEE2E2
PharmaSync.tone.danger.foreground = #991B1B
PharmaSync.tone.info.background = #CCFBF1
PharmaSync.tone.info.foreground = #115E59
PharmaSync.tone.neutral.background = #E2E8F0
PharmaSync.tone.neutral.foreground = #334155

PharmaSync.chart.grid = #EDF0F4
